<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Coordenadas</title>
</head>
<body>
    <h1>MapsFriends</h1>

    <p id="frase-principal">Descubra aqui a sua localização!</p>

    <p id="frase-explicativa">Nos informe sua coordenada e iremos mostrar onde você está localizado.</p>

    <img src="./img/Captura de tela 2026-09-29 113201.png" alt="Imagem do plano cartesiano para referência.">

    <div class="inputs">
        <fieldset id="x">
            <label for="X">Valor de X: </label>
            <input type="number" id="X" placeholder="Valor aqui">
        </fieldset>

        <fieldset id="y">
            <label for="Y">Valor de Y: </label>
            <input type="number" id="Y" placeholder="Valor aqui">
        </fieldset>
    </div>

    <button id="button">Descubra sua posição!</button>
</body>
</html>
